slurm:
  account: lappi
  job-name: dipLO_HERA
  partition: small
  nodes: 1
  ntasks: 1
  time: "23:59:00"
  cpus-per-task: 1
  mem: 10G
  output: slurm_%j.log

execution:
  interpreter: julia
  executable: /projappl/lappi/abhiram/NLO_Diffraction_dipLO/sf_lo_sdaw_dip_T.jl
  modules:
    - openmpi
    - julia/1.11.9
    - julia-mpi
  env_vars:
    JULIA_NUM_THREADS: $SLURM_CPUS_PER_TASK

experiment:
  result_database_path: /scratch/lappi/abhiram/dipLO_database
  experiment_name: allbks_mvgam_balsd
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{__indicator}"
    json: "{save_dir}_{__indicator}/result.json"

inner_loop:
  file_path: /projappl/lappi/abhiram/trip/HERA_kinematic_points_smallx.txt
  delimiter: " "
  arg_names:
    - --Q
    - beta
    - --x

outer_loops:
  - type: tabular_file
    file_path: /projappl/lappi/abhiram/nlobk-nlodisft/data/mvgam,balsd/posteriorsamples.dat
    delimiter: ","
    comment_prefix: "#"
    skip_blank_lines: true
    args:
      - arg_name: dipole_path
        column: 0
        template: /projappl/lappi/abhiram/nlobk-nlodisft/data/mvgam,balsd/bks/{val}.dat

args:
  xmax: 160.0
