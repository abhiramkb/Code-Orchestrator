slurm:
  account: lappi
  job-name: dip_HERA
  partition: small
  nodes: 1
  ntasks: 1
  time: "23:59:00"
  cpus-per-task: 192
  mem: 80G
  output: slurm_%j.log

execution:
  multithreading_level: 16
  interpreter: julia
  executable: /projappl/lappi/abhiram/NLO_Diffraction_dip-dip/kcbk_codes/sf_nlo_pdgm_dip_T.jl
  modules:
    - openmpi
    - julia/1.11.9
    - julia-mpi
  env_vars:
    JULIA_NUM_THREADS: $MULTITHREADING_LEVEL

experiment:
  result_database_path: /scratch/lappi/abhiram/dip_database
  experiment_name: kcbk_median_mvgam_pd
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{__indicator}"
    json: "{save_dir}_{__indicator}/result.json"

inner_loop:
  file_path: /projappl/lappi/abhiram/trip/HERA_kinematic_points_smallx.txt
  delimiter: " "
  arg_names:
    - --Q
    - beta
    - --x

args:
  dipole_path: /projappl/lappi/abhiram/bayesian_alldata/KCBK_pd_MVgamma/bk_median.dat
  Csq: 705.0
  xmax: 160.0
  neval: 400000000.0
