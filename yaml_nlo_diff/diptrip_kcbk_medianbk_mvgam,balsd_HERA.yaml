slurm:
  account: lappi
  job-name: diptrip_HERA
  partition: gpumedium
  nodes: 1
  ntasks: 1
  time: "23:59:00"
  cpus-per-task: 72
  gres: gpu:gh200:1
  output: slurm_%j.log

execution:
  interpreter: python
  executable: /projappl/lappi/abhiram/NLO_Diffraction_dip-trip/kcbk_codes/sf_nlo_sdaw_diptrip_T.py
  modules:
    - python-tensorflow
  env_vars: {}

experiment:
  result_database_path: /scratch/lappi/abhiram/diptrip_database
  experiment_name: kcbk_median_mvgam_balsd
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{__indicator}"
    json: "{save_dir}_{__indicator}/result.json"

inner_loop:
  file_path: /projappl/lappi/abhiram/trip/HERA_kinematic_points_smallx.txt
  delimiter: " "
  arg_names:
    - --Q
    - beta
    - --x

args:
  dipole_path: /projappl/lappi/abhiram/bayesian_alldata/KCBK_Balsd_MVgamma/bk_median.dat
  Csq: 1.7
  xmax: 160.0
  neval: 400000000.0
