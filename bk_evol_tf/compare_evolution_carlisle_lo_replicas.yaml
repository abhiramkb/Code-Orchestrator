slurm:
  account: lappi
  job-name: BK_tf
  partition: test
  nodes: 1
  ntasks: 1
  time: 00:15:00
  cpus-per-task: 128
  mem: 240G
  output: slurm_%j.log

execution:
  multithreading_level: 8
  interpreter: python
  executable: /projappl/lappi/abhiram/BK/compare_evolution_carlisle_lo_replicas.py
  modules:
    - python-tensorflow/2.21

experiment:
  result_database_path: /scratch/lappi/abhiram/BK_evolution
  experiment_name: compare_tf_evolution_carlisle_lo_replicas
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}_{__indicator}"

inner_loop:
    type: tabular_file
    file_path: /projappl/lappi/abhiram/bayesian_alldata/LO_MVe/posteriorsamples.dat
    delimiter: " "
    comment_prefix: "#"
    skip_blank_lines: true
    args:
      - arg_name: dipole_path
        source: row_index
        template: /projappl/lappi/abhiram/bayesian_alldata/LO_MVe/bks/{val}.dat
      - arg_name: Csq
        column: 2

args:
  th_points: 80
  cmp_rmin: 1e-6
