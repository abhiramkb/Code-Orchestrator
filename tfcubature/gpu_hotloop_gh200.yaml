# The typical tfcubature workload on one GH200 node (H100 GPU + 72-core
# Grace CPU): 400 interpolated-dipole integrals in 4D, integrated together
# and repeated for 5 steps with shifted rapidities, at rtol 1e-3 and 1e-4.
# Compares tfcubature (compiled once) with VegasFlow (grid trained once, at
# most 120 s per step) and HCubature.jl on the 72 Grace cores. See
# benchmarks/dipole_4d.py.
#
# Runs benchmarks/gpu_suite.sh for the env and dipole steps only; each writes
# <step>.txt to $SAVE_DIR and has its own checkpoint.
#
# One-time setup on a login node: as for gpu_suite_gh200.yaml (clone
# tfcubature, install HCubature and StaticArrays in julia/1.11.9).
#
# Generate (and submit):
#   python3 orchestrator.py generate tfcubature/gpu_hotloop_gh200.yaml --submit

slurm:
  account: lappi
  job-name: tfcubature_hot
  partition: gpumedium
  nodes: 1
  ntasks: 1
  time: "01:30:00"
  cpus-per-task: 72
  gres: gpu:gh200:1
  output: slurm_%j.log

execution:
  interpreter: bash
  executable: /projappl/lappi/abhiram/tfcubature/benchmarks/gpu_suite.sh
  modules:
    - python-tensorflow
    - julia/1.11.9
  env_vars:
    TF_CPP_MIN_LOG_LEVEL: 2

experiment:
  result_database_path: /scratch/lappi/abhiram/tfcubature_benchmarks
  experiment_name: gh200_hotloop
  slrm_output_dir: SLURM_OUTPUT
  tracking_args:
    save_dir: "{save_dir}"

inner_loop:
  type: explicit
  arg_name: step
  values:
    - env
    - dipole

args:
  dipole_integrals: 400
  dipole_steps: 5
  dipole_max_regions: 134217728   # 2^27 boxes, about 15 GB of box data
  dipole_vegas_seconds: 120
